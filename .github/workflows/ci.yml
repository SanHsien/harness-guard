name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  guardrails:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python entry points
        run: python -m compileall scripts hooks skills/info-diet/scripts skills/review-loop/scripts

      - name: Test danger-zone guard
        run: python hooks/danger-zone-guard/tests/run-tests.py

      - name: Test test-gate guard
        run: python hooks/test-gate-guard/tests/run-tests.py

      - name: Test UTF-8 and locale handling
        run: python hooks/tests/run-encoding-tests.py

      - name: Test installer contracts
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Exercise full dry-run plan
        run: python scripts/install.py --dry-run --agent all --hooks all --skills all
